[workspace]
members = [
    "crates/core_math",
    "crates/document",
    "crates/render_model",
    "crates/renderer_wgpu",
    "crates/runtime",
    "crates/wasm_bridge",
    "crates/scene",
    "crates/serialization",
    "crates/spatial",
]
resolver = "2"
default-members = ["crates/wasm_bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.81"

[workspace.dependencies]
bytemuck = { version = "1.21.0", features = ["derive"] }
pollster = "0.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
rstar = "0.12.2"
thiserror = "2.0.16"
uuid = { version = "1.18.1", features = ["serde", "v4", "js"] }
wgpu = { version = "0.20.1", features = ["wgsl"] }
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
proptest = "1.7.0"

